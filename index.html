<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimpleCal">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>SimpleCal</title>
<style>
:root{
  --bg:#0b1410; --card:#14221a; --card2:#1b3024; --line:#25402f;
  --accent:#2ee57a; --accent-d:#1a9c53; --text:#eaf5ee; --muted:#8fb09b;
  --blue:#4aa8ff; --warn:#ffb020;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}

/* Header / date nav */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar .label{font-size:20px;font-weight:700;text-transform:capitalize;text-align:center;flex:1}
.datebar .label small{display:block;font-size:12px;font-weight:500;color:var(--muted);text-transform:none}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);font-size:22px;cursor:pointer}
.iconbtn:active{background:var(--card2)}
.iconbtn[disabled]{opacity:.3}

/* Summary */
.summary{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
.hello{font-size:13px;color:var(--muted);margin-bottom:4px}
.big{font-size:44px;font-weight:800;line-height:1}
.big span{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px}
.status{margin:8px 0 14px;font-size:17px;font-weight:700}
.status small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.status.mer{color:var(--warn)} .status.nesten{color:var(--blue)} .status.ok{color:var(--accent)}
.track{position:relative;height:20px;background:#0e1b14;border-radius:10px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(46,229,122,.18);
  border-left:1px dashed var(--accent-d);border-right:1px dashed var(--accent-d)}
.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-d),var(--accent));
  border-radius:10px;transition:width .25s}
.fill.over{background:linear-gradient(90deg,#2a7fd0,var(--blue))}

/* Meal accordion */
.meal{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.meal.done{border-color:var(--accent-d)}
.mhead{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 16px;cursor:pointer}
.mhead:active{background:var(--card2)}
.mhead h2{margin:0;font-size:18px}
.mhead .r{font-size:15px;color:var(--muted);font-weight:700}
.meal.done .mhead .r{color:var(--accent)}
.mbody{padding:0 12px 12px}
.tools{display:flex;gap:8px;margin:0 0 10px}
.tools .btn{height:40px;font-size:14px;padding:0 14px}
.mnote{font-size:12px;color:var(--warn);margin:0 2px 10px}

/* Item cards with chips */
.item{padding:12px;border-radius:16px;background:#101c15;border:2px solid var(--line);margin-bottom:8px}
.item.on{background:var(--card2);border-color:var(--accent)}
.itop{display:flex;align-items:center;gap:10px}
.itop .emoji{font-size:28px;line-height:1}
.itop .name{flex:1;font-size:16px;font-weight:600;line-height:1.2}
.itop .kc{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.item.on .kc{color:var(--accent)}
.chips{display:flex;gap:8px;margin-top:10px}
.ch{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:#0e1b14;
  font-weight:700;font-size:16px;cursor:pointer}
.ch:active{transform:scale(.96)}
.ch.on{background:var(--accent);color:#04210f;border-color:var(--accent)}
.ch small{display:block;font-size:10px;font-weight:500;opacity:.75;margin-top:-2px}

/* Extra / forms */
.extra{display:flex;gap:8px;margin-top:6px}
.extra input,.field input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--text);padding:0 14px;font-size:16px;-webkit-user-select:text;user-select:text}
.btn{height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:#04210f;
  font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{color:#ff7a7a}
.tag{display:inline-flex;align-items:center;gap:6px;margin:8px 8px 0 0;padding:8px 12px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);font-size:14px}
.tag button{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 2px 6px}

/* Week */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .v{font-size:28px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.bars{position:relative;display:flex;gap:6px;align-items:flex-end;height:170px;margin:6px 0 4px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px}
.bars .zoneband{position:absolute;left:0;right:0;background:rgba(46,229,122,.12);
  border-top:1px dashed var(--accent-d);border-bottom:1px dashed var(--accent-d);pointer-events:none}
.bcol{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;cursor:pointer}
.bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--accent-d);min-height:3px}
.bar.in{background:var(--accent)} .bar.over{background:var(--blue)} .bar.none{background:var(--line)}
.bcol .n{font-size:10px;color:var(--muted);margin-bottom:3px}
.days{display:flex;gap:6px;padding:0 8px;margin-bottom:18px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.days div.today{color:var(--accent);font-weight:700}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow .nm{flex:0 0 120px;font-size:14px}
.mrow .mb{flex:1;height:10px;background:#0e1b14;border-radius:6px;overflow:hidden}
.mrow .mb i{display:block;height:100%;background:var(--accent-d);border-radius:6px}
.mrow .val{flex:0 0 64px;text-align:right;font-size:14px;font-weight:700}
h3{margin:18px 2px 6px;font-size:16px}
.note{font-size:12px;color:var(--muted);margin:6px 2px}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(11,20,16,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:200px;height:52px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);font-size:15px;font-weight:700;cursor:pointer}
nav button.active{background:var(--accent);color:#04210f;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-act="tab" data-tab="day" id="tab-day">🍽️ I dag</button>
  <button data-act="tab" data-tab="week" id="tab-week">📊 Uke</button>
  <button data-act="tab" data-tab="me" id="tab-me">👤 Meg</button>
</nav>
<input type="file" id="importFile" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ===== CONFIG – edit this to change the menu and kcal values ===== */
/* N(per, counts)  = countable food: chips are numbers, kcal = number x per
   Z(l, v, s)      = plate meal: chips Liten / Vanlig / Stor with their own kcal
   C([label,kcal]…) = custom chips                                             */
const DEFAULT_GOAL = 4000;
const ZONE_HALF = 500;                     // zone = goal ± 500

const N = (per, counts = [2, 3, 4, 5]) => counts.map(n => ({ l: String(n), kcal: n * per }));
const Z = (l, v, s) => [{ l: 'Liten', kcal: l }, { l: 'Vanlig', kcal: v }, { l: 'Stor', kcal: s }];
const C = (...a) => a.map(([l, kcal]) => ({ l, kcal }));

const SECTIONS = [
  { id: 'breakfast', name: 'Frokost', emoji: '🍳', items: [
    { id: 'b_brod',  name: 'Brødskiver med pålegg',  emoji: '🍞', opts: N(150) },
    { id: 'b_egg',   name: 'Egg',                    emoji: '🥚', opts: N(80) },
    { id: 'b_havre', name: 'Havregrøt + syltetøy',   emoji: '🥣', opts: Z(350, 500, 700) },
    { id: 'b_flak',  name: 'Frokostblanding + melk', emoji: '🥛', opts: Z(300, 450, 600) },
    { id: 'b_yog',   name: 'Yoghurt + müsli',        emoji: '🍨', opts: Z(300, 450, 600) },
  ]},
  { id: 'lunch', name: 'Skolelunsj', emoji: '🎒', items: [
    { id: 'l_toast', name: 'Toast skinke/ost',       emoji: '🥪', opts: N(210) },
    { id: 'l_brod',  name: 'Matpakke-brødskiver',    emoji: '🍞', opts: N(150) },
    { id: 'l_rund',  name: 'Rundstykke med pålegg',  emoji: '🥖', opts: N(250, [1, 2, 3]) },
    { id: 'l_wrap',  name: 'Wrap med kylling',       emoji: '🌯', opts: N(350, [1, 2, 3]) },
    { id: 'l_havre', name: 'Havregryn + nøtter + syltetøy', emoji: '🥜', opts: Z(500, 750, 950) },
  ]},
  { id: 'pre', name: 'Før trening', emoji: '⚽', items: [
    { id: 'p_pb',    name: 'Brødskive med peanøttsmør', emoji: '🥜', opts: N(200, [1, 2, 3]) },
    { id: 'p_bar',   name: 'Müslibar',               emoji: '🍫', opts: N(200, [1, 2]) },
    { id: 'p_nuts',  name: 'Nøtter (neve)',          emoji: '🥜', opts: N(250, [1, 2, 3]) },
    { id: 'p_saft',  name: 'Saft / sportsdrikk (5 dl)', emoji: '🧃', opts: C(['1 stk', 100]) },
  ]},
  { id: 'post', name: 'Etter trening', emoji: '💪', items: [
    { id: 'a_choc',  name: 'Sjokolademelk',          emoji: '🥛', opts: C(['3 dl', 250], ['5 dl', 400]) },
    { id: 'a_shake', name: 'Proteinshake med melk',  emoji: '🥤', opts: C(['Vanlig', 350], ['Stor', 500]) },
    { id: 'a_matb',  name: 'Kylling + ris (matboks)',emoji: '🍗', opts: Z(550, 750, 950) },
    { id: 'a_wrap',  name: 'Wrap med kylling',       emoji: '🌯', opts: N(350, [1, 2, 3]) },
  ]},
  { id: 'dinner', name: 'Middag', emoji: '🍽️', items: [
    { id: 'd_kyl',   name: 'Kylling + ris + grønnsaker', emoji: '🍛', opts: Z(700, 1000, 1300) },
    { id: 'd_laks',  name: 'Laks/ørret + poteter',   emoji: '🐟', opts: Z(650, 850, 1050) },
    { id: 'd_pasta', name: 'Pasta + kjøttsaus',      emoji: '🍝', opts: Z(750, 1000, 1300) },
    { id: 'd_wok',   name: 'Wok med kylling',        emoji: '🥘', opts: Z(700, 950, 1200) },
    { id: 'd_taco',  name: 'Taco (lefser)',          emoji: '🌮', opts: N(250) },
    { id: 'd_pizza', name: 'Pizza (skiver)',         emoji: '🍕', opts: N(280) },
  ]},
  { id: 'evening', name: 'Kveldsmat', emoji: '🌙', items: [
    { id: 'e_havre', name: 'Havregrøt + syltetøy',   emoji: '🥣', opts: Z(350, 500, 700) },
    { id: 'e_toast', name: 'Toast ost/skinke',       emoji: '🥪', opts: N(210) },
    { id: 'e_egg',   name: 'Egg',                    emoji: '🥚', opts: N(80) },
    { id: 'e_brod',  name: 'Brødskiver',             emoji: '🍞', opts: N(150) },
    { id: 'e_rest',  name: 'Rester fra middag',      emoji: '🍗', opts: Z(450, 650, 850) },
    { id: 'e_skyr',  name: 'Skyr/yoghurt + müsli',   emoji: '🍨', opts: Z(300, 450, 600) },
  ]},
  { id: 'drink', name: 'Drikke', emoji: '🥛', note: '⚠️ Sjekk at saft og smoothie ikke har appelsin.', items: [
    { id: 'k_melk',  name: 'Melk (glass)',           emoji: '🥛', opts: N(110, [1, 2, 3, 4]) },
    { id: 'k_kakao', name: 'Kakao',                  emoji: '☕', opts: N(150, [1, 2, 3]) },
    { id: 'k_eple',  name: 'Eplejuice (glass)',      emoji: '🧃', opts: N(90, [1, 2, 3]) },
    { id: 'k_smoo',  name: 'Smoothie',               emoji: '🥤', opts: C(['Vanlig', 350], ['Stor', 500]) },
  ]},
  { id: 'boost', name: 'Boostere', emoji: '⚡', items: [
    { id: 'x_nuts',  name: 'Nøtter (neve)',          emoji: '🥜', opts: N(250, [1, 2, 3]) },
    { id: 'x_smor',  name: 'Ekstra smør/olje på maten', emoji: '🧈', opts: C(['1 stk', 100]) },
    { id: 'x_ost',   name: 'Ostebiter',              emoji: '🧀', opts: N(100, [1, 2, 3]) },
    { id: 'x_rosin', name: 'Rosiner / tørket frukt', emoji: '🍇', opts: N(150, [1, 2]) },
  ]},
];
/* ================================================================== */

const STORE_KEY = 'simplecal.v2';
const ITEMS = {};
SECTIONS.forEach(s => s.items.forEach(i => ITEMS[i.id] = i));

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
const fmtNum = n => Math.round(n).toLocaleString('nb-NO');
const isoWeek = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
};

/* ---- storage ---- */
let db = load();
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(STORE_KEY));
    if (r && r.days) { r.profile = Object.assign({ name: '', goal: DEFAULT_GOAL }, r.profile); return r; }
  } catch (e) {}
  return { profile: { name: '', goal: DEFAULT_GOAL }, days: {} };
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }
const readDay = d => db.days[key(d)] || { items: {}, extra: [] };
function writeDay(d) { const k = key(d); return db.days[k] || (db.days[k] = { items: {}, extra: [] }); }
function prune(d) {
  const k = key(d), day = db.days[k];
  if (day && !Object.keys(day.items).length && !day.extra.length) delete db.days[k];
}

/* ---- goal / zone ---- */
const goal = () => db.profile.goal;
const zone = () => [goal() - ZONE_HALF, goal() + ZONE_HALF];
const scaleMax = () => Math.ceil((goal() + 1000) / 500) * 500;

/* ---- calculations ---- */
const optKcal = (item, label) => { const o = item.opts.find(o => o.l === label); return o ? o.kcal : 0; };
function sectionTotal(day, s) {
  return s.items.reduce((sum, i) => sum + (day.items[i.id] ? optKcal(i, day.items[i.id]) : 0), 0);
}
const extraTotal = day => day.extra.reduce((a, b) => a + b, 0);
const dayTotal = day => SECTIONS.reduce((sum, s) => sum + sectionTotal(day, s), 0) + extraTotal(day);

/* ---- view state ---- */
const today = startOfDay(new Date());
const view = { tab: 'day', date: today, open: undefined };  // open: undefined = auto, null = none
const $app = document.getElementById('app');

function render() {
  $app.innerHTML = view.tab === 'day' ? dayView() : view.tab === 'week' ? weekView() : meView();
  ['day', 'week', 'me'].forEach(t => document.getElementById('tab-' + t).classList.toggle('active', view.tab === t));
}

function dayLabel(d) {
  const diff = Math.round((d - today) / 86400000);
  const full = new Intl.DateTimeFormat('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
  if (diff === 0) return `I dag<small>${full}</small>`;
  if (diff === -1) return `I går<small>${full}</small>`;
  return full;
}

function statusFor(total) {
  const [zl, zh] = zone(), g = goal();
  if (total === 0) return { cls: 'mer', text: 'Trykk på det du har spist 👇', sub: '' };
  const left = g - total;
  const sub = left > 0 ? `Mangler ca ${fmtNum(left)} kcal` : '';
  if (total < g * 0.75) return { cls: 'mer', text: 'Mer! 🔥', sub };
  if (total < zl) return { cls: 'nesten', text: 'Nesten 💪', sub };
  if (total <= zh) return { cls: 'ok', text: 'Mål nådd ✅', sub };
  return { cls: 'ok', text: 'Mål nådd ✅', sub: 'Over sonen – mye energi i dag' };
}

function itemCard(item, day) {
  const sel = day.items[item.id];
  const kc = sel ? optKcal(item, sel) : 0;
  const lo = Math.min(...item.opts.map(o => o.kcal)), hi = Math.max(...item.opts.map(o => o.kcal));
  const hint = sel ? `${fmtNum(kc)} kcal` : (lo === hi ? `~${fmtNum(lo)}` : `${fmtNum(lo)}–${fmtNum(hi)}`);
  const chips = item.opts.map(o => {
    const showKcal = item.opts.length <= 3 && !/^\d+$/.test(o.l);
    return `<button class="ch ${sel === o.l ? 'on' : ''}" data-act="chip" data-id="${item.id}" data-l="${esc(o.l)}">${esc(o.l)}${showKcal ? `<small>${fmtNum(o.kcal)}</small>` : ''}</button>`;
  }).join('');
  return `<div class="item ${sel ? 'on' : ''}">
    <div class="itop"><span class="emoji">${item.emoji}</span><span class="name">${item.name}</span><span class="kc">${hint}</span></div>
    <div class="chips">${chips}</div></div>`;
}

function dayView() {
  const d = view.date, day = readDay(d), total = dayTotal(day), g = goal(), [zl, zh] = zone(), max = scaleMax();
  const st = statusFor(total);
  const pct = Math.min(total / max, 1) * 100;
  const firstEmpty = SECTIONS.find(s => sectionTotal(day, s) === 0);
  const openId = view.open === undefined ? (firstEmpty ? firstEmpty.id : null) : view.open;

  const meals = SECTIONS.map(s => {
    const sub = sectionTotal(day, s), isOpen = openId === s.id;
    const body = isOpen ? `<div class="mbody">
      <div class="tools"><button class="btn ghost" data-act="copyYesterday" data-id="${s.id}">↻ Som i går</button>
        ${sub ? `<button class="btn ghost danger" data-act="clearSection" data-id="${s.id}">Nullstill</button>` : ''}</div>
      ${s.note ? `<div class="mnote">${s.note}</div>` : ''}
      ${s.items.map(i => itemCard(i, day)).join('')}</div>` : '';
    return `<section class="meal ${sub ? 'done' : ''}">
      <div class="mhead" data-act="open" data-id="${s.id}"><h2>${s.emoji} ${s.name}</h2>
        <div class="r">${sub ? `✅ ${fmtNum(sub)}` : (isOpen ? '▾' : '›')}</div></div>${body}</section>`;
  }).join('');

  const extraOpen = openId === 'extra';
  const extras = day.extra.map((k, idx) =>
    `<span class="tag">+${fmtNum(k)} kcal <button data-act="delExtra" data-idx="${idx}" aria-label="Fjern">✕</button></span>`).join('');
  const extraMeal = `<section class="meal ${day.extra.length ? 'done' : ''}">
    <div class="mhead" data-act="open" data-id="extra"><h2>➕ Annet</h2>
      <div class="r">${day.extra.length ? `✅ ${fmtNum(extraTotal(day))}` : (extraOpen ? '▾' : '›')}</div></div>
    ${extraOpen || day.extra.length ? `<div class="mbody">
      ${extraOpen ? `<div class="extra"><input id="extraKcal" type="number" inputmode="numeric" placeholder="kcal, f.eks. 300">
        <button class="btn" data-act="addExtra">Legg til</button></div>` : ''}
      <div>${extras}</div></div>` : ''}</section>`;

  return `
    <div class="datebar">
      <button class="iconbtn" data-act="shift" data-n="-1" aria-label="Forrige dag">‹</button>
      <div class="label">${dayLabel(d)}</div>
      <button class="iconbtn" data-act="shift" data-n="1" aria-label="Neste dag" ${d >= today ? 'disabled' : ''}>›</button>
    </div>
    <div class="summary">
      ${db.profile.name ? `<div class="hello">Hei, ${esc(db.profile.name)} 👋</div>` : ''}
      <div class="big">${fmtNum(total)}<span>/ ${fmtNum(g)} kcal</span></div>
      <div class="status ${st.cls}">${st.text}${st.sub ? `<small>${st.sub}</small>` : ''}</div>
      <div class="track">
        <div class="zone" style="left:${zl / max * 100}%;width:${(zh - zl) / max * 100}%"></div>
        <div class="fill ${total > zh ? 'over' : ''}" style="width:${pct}%"></div>
      </div>
    </div>
    ${meals}${extraMeal}`;
}

function weekView() {
  const mon = mondayOf(view.date), [zl, zh] = zone(), max = scaleMax();
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  const totals = days.map(d => dayTotal(readDay(d)));
  const logged = days.filter((d, i) => totals[i] > 0);
  const avg = logged.length ? totals.reduce((a, b) => a + b, 0) / logged.length : 0;
  const inZone = totals.filter(t => t >= zl).length;
  const names = ['Ma', 'Ti', 'On', 'To', 'Fr', 'Lø', 'Sø'];
  const sun = days[6];
  const isCurrent = key(mondayOf(today)) === key(mon);

  const bars = days.map((d, i) => {
    const t = totals[i];
    const h = Math.min(t / max, 1) * 100;
    const c = !t ? 'none' : t > zh ? 'over' : t >= zl ? 'in' : '';
    return `<div class="bcol" data-act="goDay" data-date="${key(d)}">
      <div class="n">${t ? (Math.round(t / 100) / 10).toFixed(1) + 'k' : ''}</div>
      <div class="bar ${c}" style="height:${h}%"></div></div>`;
  }).join('');
  const labels = days.map((d, i) => `<div class="${key(d) === key(today) ? 'today' : ''}">${names[i]}<br>${d.getDate()}.</div>`).join('');

  const rows = SECTIONS.map(s => {
    const t = logged.reduce((a, d) => a + sectionTotal(readDay(d), s), 0);
    return { nm: `${s.emoji} ${s.name}`, a: logged.length ? t / logged.length : 0 };
  });
  const oa = logged.length ? logged.reduce((a, d) => a + extraTotal(readDay(d)), 0) / logged.length : 0;
  if (oa) rows.push({ nm: '➕ Annet', a: oa });
  const maxAvg = Math.max(1, ...rows.map(r => r.a));
  const mrows = rows.map(r => `<div class="mrow"><div class="nm">${r.nm}</div>
      <div class="mb"><i style="width:${r.a / maxAvg * 100}%"></i></div><div class="val">${fmtNum(r.a)}</div></div>`).join('');

  return `
    <div class="datebar">
      <button class="iconbtn" data-act="weekShift" data-n="-7" aria-label="Forrige uke">‹</button>
      <div class="label">Uke ${isoWeek(mon)}<small>${mon.getDate()}.${mon.getMonth() + 1}. – ${sun.getDate()}.${sun.getMonth() + 1}.</small></div>
      <button class="iconbtn" data-act="weekShift" data-n="7" aria-label="Neste uke" ${isCurrent ? 'disabled' : ''}>›</button>
    </div>
    <div class="cards">
      <div class="stat"><div class="v">${fmtNum(avg)}</div><div class="l">snitt kcal / dag (${logged.length} dager logget)</div></div>
      <div class="stat"><div class="v">${inZone} / 7</div><div class="l">dager med mål nådd (${fmtNum(zl)}+)</div></div>
    </div>
    <div class="bars">
      <div class="zoneband" style="bottom:calc(${zl / max * 100}% * .92 + 8px);height:calc(${(zh - zl) / max * 100}% * .92)"></div>
      ${bars}
    </div>
    <div class="days">${labels}</div>
    <h3>Snitt per måltid (kcal)</h3>
    <div>${mrows}</div>
    <p class="note">Snitt regnes kun over dager med noe logget. Trykk på en søyle for å åpne dagen.</p>`;
}

function meView() {
  return `
    <div class="datebar"><div class="label">👤 Meg</div></div>
    <div class="field"><label for="pname">Navn</label>
      <input id="pname" type="text" maxlength="30" value="${esc(db.profile.name)}" placeholder="Valgfritt"></div>
    <div class="field"><label for="pgoal">Mål per dag (kcal)</label>
      <input id="pgoal" type="number" inputmode="numeric" min="1000" max="8000" step="100" value="${goal()}"></div>
    <p class="note">Målsonen er mål ±${ZONE_HALF} kcal. Standard er ${fmtNum(DEFAULT_GOAL)}.</p>
    <h3>Sikkerhetskopi</h3>
    <p class="note">Alt lagres kun i denne nettleseren på denne enheten. Ingen konto, ingen server. Ta backup av og til, eller bruk filen for å flytte data til en annen enhet (f.eks. PC).</p>
    <div class="extra">
      <button class="btn ghost" style="flex:1" data-act="export">⬇️ Eksporter</button>
      <button class="btn ghost" style="flex:1" data-act="import">⬆️ Importer</button>
    </div>
    <h3>Slett alt</h3>
    <div class="extra"><button class="btn ghost danger" style="flex:1" data-act="wipe">🗑️ Slett alle data</button></div>
    <p class="note">Kcal-verdiene er grove anslag, ikke nøyaktige målinger.</p>`;
}

/* ---- actions ---- */
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'tab') { view.tab = el.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (a === 'shift') {
    const nd = addDays(view.date, Number(el.dataset.n));
    if (nd <= today) { view.date = nd; view.open = undefined; render(); window.scrollTo(0, 0); }
    return;
  }
  if (a === 'weekShift') {
    const nd = addDays(view.date, Number(el.dataset.n));
    view.date = nd > today ? today : nd; render(); return;
  }
  if (a === 'goDay') { view.date = parseKey(el.dataset.date); view.open = undefined; view.tab = 'day'; render(); window.scrollTo(0, 0); return; }
  if (a === 'open') {
    view.open = (view.open === undefined ? autoOpen() : view.open) === el.dataset.id ? null : el.dataset.id;
    keepScroll(render); return;
  }
  if (a === 'chip') {
    const id = el.dataset.id, l = el.dataset.l, day = writeDay(view.date);
    if (day.items[id] === l) delete day.items[id]; else day.items[id] = l;
    prune(view.date); save(); buzz(); keepScroll(render); return;
  }
  if (a === 'copyYesterday') {
    const s = SECTIONS.find(x => x.id === el.dataset.id), prev = readDay(addDays(view.date, -1));
    const picks = s.items.filter(i => prev.items[i.id] && optKcal(i, prev.items[i.id]));
    if (!picks.length) { toast('Ingenting i går å kopiere'); return; }
    const day = writeDay(view.date);
    s.items.forEach(i => delete day.items[i.id]);
    picks.forEach(i => day.items[i.id] = prev.items[i.id]);
    save(); buzz(); keepScroll(render); return;
  }
  if (a === 'clearSection') {
    const s = SECTIONS.find(x => x.id === el.dataset.id), day = writeDay(view.date);
    s.items.forEach(i => delete day.items[i.id]);
    prune(view.date); save(); keepScroll(render); return;
  }
  if (a === 'addExtra') {
    const v = Math.round(Number(document.getElementById('extraKcal').value));
    if (!(v > 0 && v < 5000)) { toast('Skriv inn kcal (1–4999)'); return; }
    writeDay(view.date).extra.push(v); save(); buzz(); keepScroll(render); return;
  }
  if (a === 'delExtra') {
    const day = writeDay(view.date); day.extra.splice(Number(el.dataset.idx), 1);
    prune(view.date); save(); keepScroll(render); return;
  }
  if (a === 'export') { exportData(); return; }
  if (a === 'import') { document.getElementById('importFile').click(); return; }
  if (a === 'wipe') {
    if (confirm('Slette ALLE data på denne enheten? Dette kan ikke angres.')) {
      db = { profile: { name: '', goal: DEFAULT_GOAL }, days: {} }; save(); render(); toast('Alt er slettet');
    }
  }
});

function autoOpen() {
  const day = readDay(view.date), s = SECTIONS.find(x => sectionTotal(day, x) === 0);
  return s ? s.id : null;
}

document.addEventListener('change', e => {
  if (e.target.id === 'pname') { db.profile.name = e.target.value.trim().slice(0, 30); save(); toast('Lagret'); }
  if (e.target.id === 'pgoal') {
    const v = Math.round(Number(e.target.value));
    if (v >= 1000 && v <= 8000) { db.profile.goal = v; save(); toast('Mål lagret'); }
    else { e.target.value = goal(); toast('Velg mellom 1000 og 8000'); }
  }
});

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `simplecal-${key(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById('importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data.days !== 'object') throw new Error('bad format');
    let n = 0;
    for (const [k, v] of Object.entries(data.days)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k) || !v || typeof v.items !== 'object') continue;
      const items = {};
      for (const [id, l] of Object.entries(v.items)) if (ITEMS[id] && optKcal(ITEMS[id], String(l))) items[id] = String(l);
      const extra = (Array.isArray(v.extra) ? v.extra : []).map(Number).filter(x => x > 0);
      db.days[k] = { items, extra }; n++;
    }
    if (data.profile && Number(data.profile.goal) >= 1000 && Number(data.profile.goal) <= 8000) {
      db.profile.goal = Math.round(Number(data.profile.goal));
      if (typeof data.profile.name === 'string') db.profile.name = data.profile.name.slice(0, 30);
    }
    save(); render(); toast(`Importerte ${n} dager`);
  } catch (err) { toast('Ugyldig fil'); }
  ev.target.value = '';
});

/* Roll over to the new day if the app stays open past midnight */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && key(new Date()) !== key(today)) location.reload();
});

/* Offline support (only over http/https) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
